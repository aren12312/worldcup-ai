name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: worldcup-ai
  REGION: us-central1
  REPOSITORY: worldcup-repo
  BACKEND_SERVICE: worldcup-ai
  FRONTEND_SERVICE: worldcup-ai-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/999264609001/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@worldcup-ai.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push backend
        run: |
          docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$BACKEND_SERVICE:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$BACKEND_SERVICE:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$BACKEND_SERVICE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --timeout 120 \
            --set-env-vars "FOOTBALL_DATA_API_KEY=${{ secrets.FOOTBALL_DATA_API_KEY }},TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_CHAT_ID=${{ secrets.CHAT_ID }},TELEGRAM_BOT_USERNAME=WorldCupApi,ODDS_API_KEY=${{ secrets.ODDS_API_KEY }},WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe $BACKEND_SERVICE --region $REGION --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"

      - name: Set PUBLIC_BASE_URL for Telegram webhook
        run: |
          gcloud run services update $BACKEND_SERVICE \
            --region $REGION \
            --update-env-vars "PUBLIC_BASE_URL=${{ steps.backend.outputs.url }}"

      - name: Register Telegram webhook
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook?url=${{ steps.backend.outputs.url }}/telegram/webhook"
            echo ""
            sleep 15
            curl -s -X POST "${{ steps.backend.outputs.url }}/telegram/setup"
            echo ""
            curl -s "${{ steps.backend.outputs.url }}/telegram/status"
            echo ""
          else
            echo "TELEGRAM_BOT_TOKEN not set — skipping webhook"
          fi

      - name: Build and push frontend
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.backend.outputs.url }} \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$FRONTEND_SERVICE:${{ github.sha }} \
            .
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$FRONTEND_SERVICE:${{ github.sha }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$FRONTEND_SERVICE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
