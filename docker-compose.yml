services:
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend

  bot:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -q httpx python-dotenv python-telegram-bot && python telegram_bot.py"
    env_file:
      - .env
    environment:
      API_URL: http://backend:8080
    volumes:
      - .:/app
    depends_on:
      - backend
